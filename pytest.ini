[pytest]
# Run with `make test` (or `make test ARGS="-k search -x"`).
minversion = 9.0
testpaths = tests
# Make `import app` work from tests/ without installing anything.
pythonpath = .
addopts = -ra
# strict = strict_config + strict_markers + strict_xfail + strict_parametrization_ids:
# an xfail that unexpectedly passes FAILS the run, so fixing a known bug flips its test.
strict = true
# Any warning (including unclosed-file ResourceWarnings surfaced by pytest) is an error.
filterwarnings =
    error
